apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uni-book-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/volodymyrDobry/uni-book-store-gitops.git
    targetRevision: main
    path: charts/uni-book-store
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: uni-book-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # If the app ever syncs before the Rollout CRD exists, retry instead of failing.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
